projects:
- name: vpc
  dir: terraform/vpc
  workflows: 
    - checkov
- name: eks
  dir: terraform/eks
  workflows: 
    - checkov
auto_merge: true
auto_merge_strategy: "squash" # optional, only supported on github
telemetry: false

workflows:
  checkov:
    plan:
      steps:
        - init
        - plan
        - run: checkov -d . --framework terraform --soft-fail --compact --config-file $GITHUB_WORKSPACE/.checkov.yaml | tee -a $DIGGER_OUT
